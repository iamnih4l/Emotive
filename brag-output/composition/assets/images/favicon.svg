<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141622" />
      <stop offset="85%" stop-color="#09090d" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>

    <!-- Amber Radiant Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#d49b43" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Violet Ethereal Core Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="60%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(212, 155, 67, 0.25)" stroke-width="1.2" />

  <!-- The "Seeing Story": Fusion of an Open Manuscript and Human Iris -->

  <!-- Top Ethereal Arc (Eye brow / Celestial arch) -->
  <path d="M14 31C20 22 44 22 50 31" stroke="url(#amberGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Lower Book Pages Arc (Open book wings) -->
  <!-- Left Page -->
  <path d="M32 44C26 40 18 39 13 41C15 35 22 32 32 36" fill="rgba(212, 155, 67, 0.12)" stroke="url(#amberGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Page -->
  <path d="M32 44C38 40 46 39 51 41C49 35 42 32 32 36" fill="rgba(167, 139, 250, 0.12)" stroke="url(#violetGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Book Spine Center Line -->
  <line x1="32" y1="36" x2="32" y2="46" stroke="#d49b43" stroke-width="2" stroke-linecap="round" />

  <!-- Central Glowing Iris / Beacon Core -->
  <circle cx="32" cy="29" r="6.5" fill="#09090d" stroke="url(#amberGrad)" stroke-width="2.2" filter="url(#glow)" />
  <circle cx="32" cy="29" r="3.2" fill="url(#amberGrad)" />

  <!-- Radiant Light Pupil Glint / Spark -->
  <path d="M32 24.5V26M32 32V33.5M27.5 29H29M35 29H36.5" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="33.2" cy="27.8" r="1.1" fill="#ffffff" />
</svg>
